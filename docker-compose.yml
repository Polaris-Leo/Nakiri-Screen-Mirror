services:
  nakiri-signalling:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nakiri-screen-mirror-signaling
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      TURN_SECRET_FILE: /run/secrets/turn_secret
      TURN_URLS: ${TURN_URLS:?Set TURN_URLS in .env}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-3600}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://mirror.example.com}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    secrets:
      - turn_secret

  coturn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/coturn/entrypoint.sh"]
    environment:
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:?Set TURN_EXTERNAL_IP in .env}
      TURN_REALM: ${TURN_REALM:?Set TURN_REALM in .env}
    volumes:
      - ./deploy/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./deploy/coturn/entrypoint.sh:/opt/coturn/entrypoint.sh:ro
    secrets:
      - turn_secret
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    healthcheck:
      test: ["CMD-SHELL", "turnutils_stunclient -p 3478 127.0.0.1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  turn_secret:
    file: ${TURN_SECRET_FILE:?Set TURN_SECRET_FILE to the host secret file path}
